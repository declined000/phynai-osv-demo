name: Apply phone layout fix once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-phone-layout.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded phone-only patch
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='a292c84a0de5e0568c0950e4b5c52ce1a5028829'
          s=raw.decode()
          css='/* Phone-only layout: let labels wrap without colliding or clipping markers. */\n@media (max-width:650px) {\n :root{--pad:16px}\n .scene{overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}\n .scene>*{flex-shrink:0;min-width:0}\n .heading>div,.panel-top>span{min-width:0}\n .heading h1,#arcos .heading h1{font-size:clamp(25px,7.5vw,30px)}\n .forecast-result-block{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}\n .forecast-result-block .badge{order:0;justify-self:start;white-space:normal}\n .forecast-result{width:100%;min-width:0;gap:16px}\n .forecast-result>strong{flex:0 0 auto;min-width:0;font-size:46px;letter-spacing:-1px}\n .forecast-result-copy{flex:1 1 0;min-width:0;gap:4px}\n .forecast-result-copy>span{font-size:15px}\n .forecast-result-copy>small{font-size:11px;line-height:1.3}\n .prediction-pair{grid-template-columns:repeat(2,minmax(0,1fr));min-height:240px}\n .result-panel{min-width:0}\n .result-panel .panel-top{flex-wrap:wrap;gap:5px;min-height:66px}\n .result-panel .panel-top strong{flex-shrink:0}\n .result-panel canvas{height:auto;min-height:140px}\n .panel-bottom{line-height:1.4}\n #arcos .prediction-sequence{gap:24px;flex-wrap:wrap;row-gap:8px}\n #arcos .prediction-sequence span{font-size:11px}\n .forecast-summary p{text-align:left}\n .scene-note{align-items:flex-start;flex-wrap:wrap;gap:6px;line-height:1.45}\n .scene-note span:first-child,.scene-note span:last-child{max-width:100%;text-align:left}\n #listen-map .listen-flow-layout{grid-template-rows:minmax(130px,.6fr) minmax(330px,1.4fr);min-height:470px}\n #listen-map .flow-model-top{flex-wrap:wrap;gap:6px 12px}\n #listen-map .flow-model-top .steps{gap:22px}\n #listen-map .flow-view{min-height:140px}\n .flow-process{flex:0 0 auto;min-height:150px;margin:0 10px 8px;padding:6px 0;overflow:visible}\n .flow-process ol{height:auto}\n .flow-process li{display:none;position:relative;left:auto;right:auto;top:auto;min-height:0;padding:0 6px 0 26px;margin:0 0 8px;transform:none;line-height:1.35}\n .flow-process li.current,.flow-process li.completed{display:block;transform:none}\n .flow-process li:before{left:8px;top:.54em}\n .flow-process li:after{left:10.5px;top:calc(.54em + 3px);height:calc(100% + 8px)}\n .flow-process .step-full{font-size:14px;line-height:1.35}\n .flow-process .step-short{font-size:12px;line-height:1.35}\n .hero-sequence{padding-left:6px;width:calc(100vw - 2 * var(--pad));--active-height:3.2em}\n .hero-sequence li{left:28px}\n .listen-layout{min-height:300px}\n .listen-copy{flex-wrap:wrap;gap:10px}\n .listen-copy .story{max-width:100%}\n .steer-grid{min-height:390px}\n .hardware-loop{min-height:340px}\n .hardware-node{height:30%;padding:8px 5px}\n .hardware-node h2{font-size:18px}\n .hardware-node p{font-size:11px}\n .hardware-node>span{font-size:9px;overflow-wrap:anywhere}\n .loop-live strong{font-size:14px}\n #apply{grid-template-rows:auto auto auto auto}\n #apply .applications{height:auto;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:auto}\n #apply .application{grid-template-rows:120px max-content auto}\n #apply .closing{flex-wrap:wrap}\n .chapter-position{min-width:0;gap:6px}\n #page-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin-left:4px}\n .transport-actions{flex-shrink:0;gap:8px}\n .transport .icon-button{min-width:32px;min-height:40px}\n}\n'
          s=s.replace('</style>',css+'\n</style>',1)
          assert s.count("window.addEventListener('wheel',e=>{")==1
          s=s.replace("window.addEventListener('wheel',e=>{","window.addEventListener('wheel',e=>{if(matchMedia('(max-width:650px)').matches&&e.target.closest('.scene')&&scenes[index].scrollHeight>scenes[index].clientHeight+1)return;",1)
          assert s.count('const dy=touchY-e.changedTouches[0].clientY;touchY=null;if(Math.abs(dy)>55)')==1
          s=s.replace('const dy=touchY-e.changedTouches[0].clientY;touchY=null;if(Math.abs(dy)>55)',"const dy=touchY-e.changedTouches[0].clientY;touchY=null;if(matchMedia('(max-width:650px)').matches&&scenes[index].scrollHeight>scenes[index].clientHeight+1)return;if(Math.abs(dy)>55)",1)
          p.write_text(s)
          
      - name: Commit phone layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix phone text overlap and allow overflowing scenes to scroll"
          git push origin HEAD:main
