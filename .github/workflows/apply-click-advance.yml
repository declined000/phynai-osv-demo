name: Apply click and tap advancement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-click-advance.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested presentation patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          insert='''// Click/tap advances the current explanation without stopping autoplay or the tour.
          function advanceStep(){
           const id=scenes[index].id;
           const sequences={question:[50,[4,8,12]],'listen-map':[30,[2/1.5,6/1.5,14/1.5]],yamada:[21,[2.5,5,12]],arcos:[19,[5,7.5,11.5,15.5]],loop:[12.8,[3.2,6.4,9.6]]};
           if(id==='steer'&&experiment<2){setExperiment(experiment+1)}
           else if(sequences[id]){
            const [period,steps]=sequences[id],cycle=Math.floor(elapsed/period),time=elapsed-cycle*period;
            const next=steps.find(t=>t>time+0.001);
            if(next!==undefined)elapsed=cycle*period+next;
            else if(index<scenes.length-1)go(index+1,false);
           }else if(index<scenes.length-1)go(index+1,false);
           last=performance.now();draw();
          }
          const stage=$('stage'),interactive='button,a,input,select,textarea,[role="button"],[contenteditable="true"],video[controls]';
          let stepPointer=null;
          stage.addEventListener('pointerdown',e=>{
           stepPointer=null;
           if(!e.isPrimary||e.button!==0||$('evidence').open||e.target.closest(interactive))return;
           stepPointer={id:e.pointerId,x:e.clientX,y:e.clientY,scene:index,moved:false};
          });
          stage.addEventListener('pointermove',e=>{
           if(stepPointer&&e.pointerId===stepPointer.id&&Math.hypot(e.clientX-stepPointer.x,e.clientY-stepPointer.y)>12)stepPointer.moved=true;
          });
          stage.addEventListener('pointercancel',()=>{stepPointer=null});
          stage.addEventListener('pointerup',e=>{
           const start=stepPointer;stepPointer=null;
           if(!start||e.pointerId!==start.id||start.moved||start.scene!==index||$('evidence').open||e.target.closest(interactive)||Math.hypot(e.clientX-start.x,e.clientY-start.y)>12)return;
           if(window.getSelection()?.toString())return;
           advanceStep();
          });
          '''
          assert 'function advanceStep' not in s
          s=s.replace("document.addEventListener('visibilitychange'",insert+"document.addEventListener('visibilitychange'",1)
          s=s.replace('Scroll or use arrow keys','Click / tap for next step · Scroll for next scene')
          p.write_text(s)
          
      - name: Commit updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Allow click and tap to advance explanation steps while autoplay continues"
          git push origin HEAD:main
