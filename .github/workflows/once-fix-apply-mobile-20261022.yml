name: One-time Apply page mobile fix
on:
  push:
    paths:
      - .github/workflows/once-fix-apply-mobile-20261022.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply targeted phone CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html")
          content = html.read_text(encoding="utf-8")
          marker = "/* Apply mobile card layout — 2026-10-22 */"
          css = "\n/* Apply mobile card layout — 2026-10-22 */\n@media screen and (max-width: 650px) {\n  #apply {\n    display: flex;\n    flex-direction: column;\n    align-items: stretch;\n    justify-content: flex-start;\n    height: 100%;\n    min-height: 0;\n    gap: 16px;\n    overflow-x: hidden;\n    overflow-y: auto;\n    padding-bottom: 24px;\n  }\n  #apply .heading { flex: 0 0 auto; gap: 10px; }\n  #apply .applications {\n    display: grid;\n    flex: 0 0 auto;\n    width: 100%;\n    height: auto;\n    max-height: none;\n    min-height: 0;\n    grid-template-columns: minmax(0, 1fr);\n    grid-template-rows: none;\n    grid-auto-rows: max-content;\n    align-content: start;\n    align-items: stretch;\n    gap: 16px;\n  }\n  #apply .application {\n    display: grid;\n    grid-template-columns: minmax(0, 40%) minmax(0, 1fr);\n    grid-template-rows: max-content auto;\n    column-gap: 14px;\n    row-gap: 5px;\n    min-height: 136px;\n    height: auto;\n    align-content: center;\n  }\n  #apply .application-image {\n    grid-column: 1;\n    grid-row: 1 / span 2;\n    position: relative;\n    align-self: stretch;\n    height: 100%;\n    min-height: 136px;\n    min-width: 0;\n  }\n  #apply .application-image img,\n  #apply .application-image video {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    object-fit: contain;\n  }\n  #apply .application:nth-child(5) .application-image img { object-fit: cover; }\n  #apply .application-image span {\n    max-width: calc(100% - 10px);\n    left: 5px;\n    bottom: 5px;\n    padding: 3px 4px;\n    font-size: 9px;\n    line-height: 1.25;\n    white-space: normal;\n    overflow-wrap: anywhere;\n  }\n  #apply .application h2 {\n    grid-column: 2;\n    grid-row: 1;\n    align-self: end;\n    margin: 0;\n    font-size: 19px;\n    line-height: 1.16;\n    overflow-wrap: anywhere;\n  }\n  #apply .application p {\n    grid-column: 2;\n    grid-row: 2;\n    align-self: start;\n    margin: 0;\n    font-size: 13px;\n    line-height: 1.4;\n    overflow-wrap: anywhere;\n  }\n  #apply .closing {\n    display: flex;\n    flex: 0 0 auto;\n    flex-wrap: wrap;\n    align-items: flex-end;\n    gap: 12px;\n    margin: 12px 0 0;\n    padding: 0;\n  }\n  #apply .closing p {\n    flex: 1 1 185px;\n    font-size: clamp(18px, 5vw, 23px);\n  }\n  #apply .closing > span { flex: 0 0 auto; margin-left: auto; }\n  #apply .scene-note {\n    flex: 0 0 auto;\n    margin: 0;\n    padding-bottom: 12px;\n  }\n}\n"
          assert content.count("</style>") == 1, "Unexpected HTML style structure"
          assert marker not in content, "Fix already applied"
          html.write_text(content.replace("</style>", css + "\n</style>", 1), encoding="utf-8")
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/once-fix-apply-mobile-20261022.yml
          git commit -m "Fix Apply page card overlap on mobile"
          git push
